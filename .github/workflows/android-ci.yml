name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.9"
          cache-disabled: true

      - name: Verify application source
        shell: bash
        run: |
          set -euo pipefail
          test -f app/build.gradle.kts
          test -f app/src/main/java/id/bmax/app/MainActivity.kt
          test -f app/src/main/java/id/bmax/app/BmaxApplication.kt
          test -f app/src/main/java/id/bmax/app/core/di/SupabaseModule.kt
          test -f app/src/main/java/id/bmax/app/feature/auth/AuthViewModel.kt
          test -f app/src/main/java/id/bmax/app/feature/auth/AuthScreen.kt
          test -f app/src/main/java/id/bmax/app/feature/customer/CustomerRepository.kt
          test -f app/src/main/java/id/bmax/app/feature/customer/CustomerViewModel.kt
          test -f app/src/main/java/id/bmax/app/feature/customer/CustomerScreen.kt
          ! grep -R "bmax-ci-debug.keystore\|base64 --decode\|bmax-ci-debug.keystore.b64" .github/workflows app/src/main app/build.gradle.kts

      - name: Build debug APK
        env:
          ORG_GRADLE_PROJECT_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          ORG_GRADLE_PROJECT_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: gradle clean assembleDebug --no-daemon --stacktrace --no-build-cache

      - name: Locate and verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          ls -lh "$APK"
          command -v apksigner >/dev/null
          apksigner verify --verbose "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: bmax-super-apps-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
