name: Android CI
on:
  push: { branches: [ "main" ] }
  pull_request: { branches: [ "main" ] }
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v6
        with: { gradle-version: "8.9", cache-disabled: true }
      - name: Verify application implementation
        shell: bash
        run: |
          set -euo pipefail
          files=(app/build.gradle.kts app/src/main/AndroidManifest.xml app/src/main/java/id/bmax/app/MainActivity.kt app/src/main/java/id/bmax/app/BmaxApplication.kt app/src/main/java/id/bmax/app/core/di/SupabaseModule.kt app/src/main/java/id/bmax/app/core/ui/Theme.kt app/src/main/java/id/bmax/app/feature/auth/AuthViewModel.kt app/src/main/java/id/bmax/app/feature/auth/AuthScreen.kt app/src/main/java/id/bmax/app/feature/customer/CustomerRepository.kt app/src/main/java/id/bmax/app/feature/customer/CustomerViewModel.kt app/src/main/java/id/bmax/app/feature/customer/CustomerScreen.kt app/src/main/java/id/bmax/app/feature/map/CustomerMapScreen.kt)
          for f in "${files[@]}"; do test -s "$f"; done
          grep -q 'com.google.android.geo.API_KEY' app/src/main/AndroidManifest.xml
          grep -q 'MAPS_API_KEY' app/build.gradle.kts
          grep -q 'play-services-maps' app/build.gradle.kts
          grep -q 'maps-compose' app/build.gradle.kts
          grep -q 'supabase.from("customers")' app/src/main/java/id/bmax/app/feature/customer/CustomerRepository.kt
          grep -q 'RoundedCornerShape' app/src/main/java/id/bmax/app/feature/auth/AuthScreen.kt
          grep -q 'RoundedCornerShape' app/src/main/java/id/bmax/app/feature/customer/CustomerScreen.kt
          grep -q 'GoogleMap' app/src/main/java/id/bmax/app/feature/map/CustomerMapScreen.kt
          ! grep -R 'bmax-ci-debug.keystore\|base64 --decode\|bmax-ci-debug.keystore.b64' .github/workflows app/src/main app/build.gradle.kts
      - name: Build debug APK
        env:
          ORG_GRADLE_PROJECT_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          ORG_GRADLE_PROJECT_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          ORG_GRADLE_PROJECT_MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
        run: gradle clean assembleDebug --no-daemon --stacktrace --no-build-cache
      - name: Verify APK
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          apksigner verify --verbose "$APK"
          ls -lh "$APK"
      - uses: actions/upload-artifact@v4
        with:
          name: bmax-super-apps-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
