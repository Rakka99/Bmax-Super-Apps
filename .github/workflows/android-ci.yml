name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.9"
          cache-disabled: false

      - name: Prepare CI debug keystore
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci
          rm -f ci/bmax-ci-debug.keystore
          keytool -genkeypair \
            -keystore ci/bmax-ci-debug.keystore \
            -storepass bmaxdebug \
            -keypass bmaxdebug \
            -alias bmaxdebug \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Bmax CI Debug, OU=Bmax, O=Bmax, L=Sumedang, ST=West Java, C=ID"
          chmod 600 ci/bmax-ci-debug.keystore
          keytool -list -keystore ci/bmax-ci-debug.keystore -storepass bmaxdebug -alias bmaxdebug >/dev/null

      - name: Build debug APK
        env:
          ORG_GRADLE_PROJECT_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          ORG_GRADLE_PROJECT_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: gradle --version && gradle clean assembleDebug --no-daemon --stacktrace

      - name: Verify APK signing and package
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          apksigner verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | head -n 3

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: bmax-super-apps-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
